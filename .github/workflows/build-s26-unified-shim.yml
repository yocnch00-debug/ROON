name: Build S26 Unified Shim

on:
  workflow_dispatch:
  push:
    branches: [ s26-unified-build ]
    paths:
      - 's26-unified-shim/**'
      - '.github/workflows/build-s26-unified-shim.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build shim APK
        working-directory: s26-unified-shim
        run: gradle --no-daemon :app:assembleDebug
      - name: Export patch pieces and signing tools
        run: |
          mkdir -p out/tools
          cp s26-unified-shim/app/build/outputs/apk/debug/app-debug.apk out/shim.apk
          unzip -p out/shim.apk AndroidManifest.xml > out/AndroidManifest.xml
          unzip -p out/shim.apk classes.dex > out/classes6.dex
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" out/tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" out/tools/zipalign
          chmod +x out/tools/zipalign
          sha256sum out/AndroidManifest.xml out/classes6.dex out/shim.apk out/tools/apksigner.jar out/tools/zipalign > out/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: s26-unified-shim
          path: out/
