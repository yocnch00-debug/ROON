name: Build S26 v1.3 Lifecycle Stability

on:
  pull_request:
    branches: [ main ]
    paths:
      - 's26-unified-source/**'
      - 'tools/patch-s26-v13-lifecycle-stability.py'
      - '.github/signing/**'
      - '.github/workflows/build-s26-v13-lifecycle-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply lifecycle-only patch
        run: python3 tools/patch-s26-v13-lifecycle-stability.py
      - name: Regression guards
        run: |
          grep -q 'versionName = "1.3-lifecycle-stability"' s26-unified-source/app/build.gradle.kts
          grep -q 'AtomicLong generation' s26-unified-source/app/src/main/java/com/onroonlink/s26source/TunnelService.java
          grep -q 'isCurrent(long gen)' s26-unified-source/app/src/main/java/com/onroonlink/s26source/TunnelService.java
          grep -q 'closeIOIfCurrent' s26-unified-source/app/src/main/java/com/onroonlink/s26source/TunnelService.java
          grep -q 'connectPcWithRetry' s26-unified-source/app/src/main/java/com/onroonlink/s26source/AlwaysGatewayBridge.java
          grep -q '10.88.10.1' s26-unified-source/app/src/main/java/com/onroonlink/s26source/AlwaysGatewayBridge.java
          grep -q '192.168.50.84' s26-unified-source/app/src/main/java/com/onroonlink/s26source/AlwaysGatewayBridge.java
          grep -q '121.133.225.83' s26-unified-source/app/src/main/java/com/onroonlink/s26source/AlwaysGatewayBridge.java
          grep -q 'LISTEN_PORT = 51921' s26-unified-source/app/src/main/java/com/onroonlink/s26source/AlwaysGatewayBridge.java
          grep -q 'PORT = 51900' s26-unified-source/app/src/main/java/com/onroonlink/s26source/TunnelService.java
          grep -q 'addRoute("10.89.0.0",24)' s26-unified-source/app/src/main/java/com/onroonlink/s26source/TunnelService.java
          grep -q 'addRoute("224.0.0.0",4)' s26-unified-source/app/src/main/java/com/onroonlink/s26source/TunnelService.java
      - name: Build release APK
        working-directory: s26-unified-source
        run: gradle --no-daemon :app:assembleRelease
      - name: Align and sign with existing stable test key
        run: |
          set -euxo pipefail
          mkdir -p out signing
          base64 -d .github/signing/onroonlink-test-key.pk8.b64 > signing/onroonlink-test-key.pk8
          cp .github/signing/onroonlink-test-cert.pem signing/onroonlink-test-cert.pem
          UNSIGNED='s26-unified-source/app/build/outputs/apk/release/app-release-unsigned.apk'
          ALIGNED='out/aligned-unsigned.apk'
          FINAL='out/ON-RoonLink-S26-UNIFIED-v1.3-LIFECYCLE-STABILITY.apk'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -v 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --key signing/onroonlink-test-key.pk8 \
            --cert signing/onroonlink-test-cert.pem \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$FINAL" > out/aapt2.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$FINAL" > out/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$FINAL" > out/zipalign.txt
          sha256sum "$FINAL" > out/SHA256.txt
          unzip -t "$FINAL" > out/unzip-test.txt
          cat > out/INSTALL.txt <<'TXT'
          S26 UNIFIED v1.3 LIFECYCLE STABILITY
          PHONE encrypted UDP/TUN protocol, addresses, routes, R8 51921 framing and PC route order are unchanged.
          Fixes restart generation overlap in TunnelService and adds one bounded same-session retry for transient PC Relay wake/routing races.
          This build intentionally does not add a new VPN, new route policy, or alter RAAT payloads.
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: ON-Roon-S26-UNIFIED-v1.3-LIFECYCLE-STABILITY
          path: out/
