name: Build S26 Unified Source

on:
  push:
    branches: [ s26-unified-source-rebuild ]
    paths:
      - 's26-unified-source/**'
      - '.github/workflows/build-s26-unified-source.yml'
  pull_request:
    paths:
      - 's26-unified-source/**'
      - '.github/workflows/build-s26-unified-source.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build exact source APK
        working-directory: s26-unified-source
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify exact APK
        run: |
          set -euxo pipefail
          mkdir -p out
          APK='s26-unified-source/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" > out/aapt2.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > out/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK" > out/zipalign.txt
          cp "$APK" out/ON-RoonLink-S26-UNIFIED-SOURCE-v1.0.apk
          sha256sum out/ON-RoonLink-S26-UNIFIED-SOURCE-v1.0.apk > out/SHA256.txt
          unzip -t out/ON-RoonLink-S26-UNIFIED-SOURCE-v1.0.apk > out/unzip-test.txt
      - uses: actions/upload-artifact@v4
        with:
          name: s26-unified-source-v1.0
          path: out/
