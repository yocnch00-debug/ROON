name: Build 20260821 R8 + PC Stability

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android-sidecar/**'
      - 'tools/patch-r8-v19-stable-tunnel.py'
      - 'tools/patch-r8-v20-wlan-backend.py'
      - 'tools/patch-r8-v21-raat-aux.py'
      - 'tools/patch-r8-v22-lifecycle-stability.py'
      - 'pc-health-supervisor/**'
      - '.github/workflows/build-stability-r8-pc-20260821.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r8-sidecar-v22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable signing key
        run: base64 -d android-sidecar/onroonlink-test.jks.b64 > android-sidecar/onroonlink-test.jks
      - name: Reconstruct golden v2.1 then apply lifecycle-only v2.2
        run: |
          python3 tools/patch-r8-v19-stable-tunnel.py
          python3 tools/patch-r8-v20-wlan-backend.py
          python3 tools/patch-r8-v21-raat-aux.py
          python3 tools/patch-r8-v22-lifecycle-stability.py
      - name: Regression guards
        run: |
          grep -q '2.2-LIFECYCLE-STABILITY' android-sidecar/app/src/main/java/com/onroonlink/sidecar/BridgeService.java
          grep -q 'versionName = "2.2-lifecycle-stability"' android-sidecar/app/build.gradle.kts
          grep -q 'AUX_UDP_TO_R8=40' android-sidecar/app/src/main/java/com/onroonlink/sidecar/TunnelMux.java
          grep -q 'AUX_UDP_FROM_R8=41' android-sidecar/app/src/main/java/com/onroonlink/sidecar/TunnelMux.java
          grep -q 'WLAN-SELF' android-sidecar/app/src/main/java/com/onroonlink/sidecar/BridgeService.java
          grep -q 'pumpToTunnel(TunnelMux owner' android-sidecar/app/src/main/java/com/onroonlink/sidecar/BridgeService.java
          grep -q 'pumpUdpToTunnel(TunnelMux owner' android-sidecar/app/src/main/java/com/onroonlink/sidecar/BridgeService.java
          grep -q 'streams.remove(id,owned)' android-sidecar/app/src/main/java/com/onroonlink/sidecar/BridgeService.java
          grep -q 'udpStreams.remove(id,owned)' android-sidecar/app/src/main/java/com/onroonlink/sidecar/BridgeService.java
          if grep -q 'heartbeat timeout' android-sidecar/app/src/main/java/com/onroonlink/sidecar/BridgeService.java; then echo 'False heartbeat teardown regressed'; exit 1; fi
      - name: Build R8 v2.2
        working-directory: android-sidecar
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify and package
        run: |
          set -euxo pipefail
          APK=android-sidecar/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 "$APK"
          mkdir -p out-r8
          cp "$APK" out-r8/ON-Roon-NetShare-R8-Sidecar-v2.2-LIFECYCLE-STABILITY.apk
          sha256sum out-r8/ON-Roon-NetShare-R8-Sidecar-v2.2-LIFECYCLE-STABILITY.apk > out-r8/SHA256.txt
          cat > out-r8/INSTALL.txt <<'TXT'
          R8 v2.2 LIFECYCLE STABILITY
          Golden v2.1 RAAT AUX TCP+UDP + WLAN-SELF data path is unchanged.
          Only tunnel-generation ownership is tightened so stale TCP/UDP pump threads cannot write into or close a newer tunnel.
          No VpnService is added. NetShare remains the R8 VPN.
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: ON-Roon-R8-v2.2-LIFECYCLE-STABILITY
          path: out-r8/

  pc-health-supervisor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Format and test build
        shell: pwsh
        run: |
          gofmt -w pc-health-supervisor/main.go
          go build ./pc-health-supervisor
      - name: Build GUI supervisor
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out-pc | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o out-pc/ONRoonLink-v3.4-PC-Health-Supervisor-v1.0.exe ./pc-health-supervisor
          (Get-FileHash out-pc/ONRoonLink-v3.4-PC-Health-Supervisor-v1.0.exe -Algorithm SHA256).Hash | Out-File out-pc/SHA256.txt
          @'
          @echo off
          setlocal
          set "DST=%LOCALAPPDATA%\ON RoonLink\Health Supervisor"
          if not exist "%DST%" mkdir "%DST%"
          copy /Y "%~dp0ONRoonLink-v3.4-PC-Health-Supervisor-v1.0.exe" "%DST%\ONRoonLink-v3.4-PC-Health-Supervisor-v1.0.exe" >nul
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v "ON RoonLink Health Supervisor" /t REG_SZ /d "\"%DST%\ONRoonLink-v3.4-PC-Health-Supervisor-v1.0.exe\"" /f >nul
          start "" "%DST%\ONRoonLink-v3.4-PC-Health-Supervisor-v1.0.exe"
          echo Installed and started.
          pause
          '@ | Set-Content -Encoding ASCII out-pc/INSTALL-PC-SUPERVISOR.bat
          @'
          @echo off
          taskkill /F /IM ONRoonLink-v3.4-PC-Health-Supervisor-v1.0.exe >nul 2>&1
          reg delete "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v "ON RoonLink Health Supervisor" /f >nul 2>&1
          echo Supervisor stopped and startup entry removed.
          pause
          '@ | Set-Content -Encoding ASCII out-pc/UNINSTALL-PC-SUPERVISOR.bat
          @'
          PC HEALTH SUPERVISOR v1.0
          This is deliberately NOT a replacement for the verified v3.4 all-in-one PC host, because the raw verified v3.4 binary/source is not stored in this repository.
          Install/run the verified ONRoonLink-Native-v1-R8-UNIFIED-v3.4-FIREWALL-FINAL.exe first.
          The supervisor passively checks TCP 51920 without opening a probe connection.
          After three consecutive missing-listener checks, it finds the embedded golden v3.0 R8 engine ONLY by its verified SHA256 and recycles only that child.
          It does not restart Roon Server, PHONE host, WireGuard, NetShare, or alter RAAT traffic.
          Log: %LOCALAPPDATA%\ON RoonLink\health-supervisor.log
          '@ | Set-Content out-pc/README-PC.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ONRoonLink-PC-Health-Supervisor-v1.0
          path: out-pc/
