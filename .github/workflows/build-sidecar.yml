name: Build ON Roon NetShare Sidecar

on:
  push:
    branches: [ main, netshare-sidecar-v1 ]
    paths:
      - 'android-sidecar/**'
      - 'android-s26-gateway/**'
      - 'pc-relay/**'
      - 'tools/**'
      - '.github/workflows/build-sidecar.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android-sidecar/**'
      - 'android-s26-gateway/**'
      - 'pc-relay/**'
      - 'tools/**'
      - '.github/workflows/build-sidecar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable signing keys
        run: |
          base64 -d android-sidecar/onroonlink-test.jks.b64 > android-sidecar/onroonlink-test.jks
          cp android-sidecar/onroonlink-test.jks android-s26-gateway/onroonlink-test.jks
      - name: Apply S26 origin-preserved query patch
        run: python3 tools/patch-s26-origin-query.py
      - name: Static origin-preserved checks
        run: |
          if grep -R 'bindSocket(' android-s26-gateway/app/src/main/java; then echo 'S26 must not use Network.bindSocket'; exit 1; fi
          grep -q 'SOOD_QUERY_PC=18' android-sidecar/app/src/main/java/com/onroonlink/sidecar/TunnelMux.java
          grep -q 'SOOD_RESPONSE_R8=19' android-sidecar/app/src/main/java/com/onroonlink/sidecar/TunnelMux.java
          grep -q 'proxyPcSoodQuery' android-sidecar/app/src/main/java/com/onroonlink/sidecar/BridgeService.java
          grep -q '1.8-STATEFUL-ENDPOINT' android-sidecar/app/src/main/java/com/onroonlink/sidecar/BridgeService.java
          grep -q 'v1.8 STATEFUL ENDPOINT' android-sidecar/app/src/main/java/com/onroonlink/sidecar/MainActivity.java
          grep -q '127.0.0.1' android-sidecar/app/src/main/java/com/onroonlink/sidecar/BridgeService.java
          grep -q 'OPEN_PC' android-sidecar/app/src/main/java/com/onroonlink/sidecar/BridgeService.java
          grep -q 'forwardOriginalRoonQueryToRelay' android-s26-gateway/app/src/main/java/com/onroonlink/s26gateway/GatewayService.java
          grep -q "new byte\[]{'S','2','6','Q'}" android-s26-gateway/app/src/main/java/com/onroonlink/s26gateway/GatewayService.java
          grep -q 'RAW ROON QUERY' android-s26-gateway/app/src/main/java/com/onroonlink/s26gateway/GatewayService.java
          grep -q '주소 저장 · 연결 유지' android-s26-gateway/app/src/main/java/com/onroonlink/s26gateway/MainActivity.java
          if grep -q 'stopService' android-s26-gateway/app/src/main/java/com/onroonlink/s26gateway/MainActivity.java; then echo 'S26 destructive restart still present'; exit 1; fi
          grep -q 'versionName = "1.9-origin-preserved-raw-sood"' android-s26-gateway/app/build.gradle.kts
      - name: Build R8 APK
        working-directory: android-sidecar
        run: gradle --no-daemon :app:assembleDebug
      - name: Build S26 Gateway APK
        working-directory: android-s26-gateway
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signatures
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android-sidecar/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android-s26-gateway/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK alignment
        run: |
          $ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 android-sidecar/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 android-s26-gateway/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify no VpnService or VPN permission
        run: |
          $ANDROID_HOME/build-tools/36.0.0/aapt dump xmltree android-sidecar/app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml > r8-manifest.txt
          $ANDROID_HOME/build-tools/36.0.0/aapt dump xmltree android-s26-gateway/app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml > s26-manifest.txt
          if grep -qE 'android.net.VpnService|BIND_VPN_SERVICE' r8-manifest.txt s26-manifest.txt; then
            echo 'Unexpected VPN component found'; cat r8-manifest.txt s26-manifest.txt; exit 1
          fi
      - name: Package Android artifacts
        run: |
          mkdir -p out
          cp android-sidecar/app/build/outputs/apk/debug/app-debug.apk out/ON-Roon-NetShare-R8-Sidecar-v1.8-STATEFUL-ENDPOINT.apk
          cp android-s26-gateway/app/build/outputs/apk/debug/app-debug.apk out/ON-Roon-S26-Gateway-v1.9-RAW-SOOD-RECOVERY.apk
          sha256sum out/ON-Roon-NetShare-R8-Sidecar-v1.8-STATEFUL-ENDPOINT.apk > out/ON-Roon-NetShare-R8-Sidecar-v1.8-STATEFUL-ENDPOINT.sha256.txt
          sha256sum out/ON-Roon-S26-Gateway-v1.9-RAW-SOOD-RECOVERY.apk > out/ON-Roon-S26-Gateway-v1.9-RAW-SOOD-RECOVERY.sha256.txt
          cp r8-manifest.txt s26-manifest.txt out/
      - uses: actions/upload-artifact@v4
        with:
          name: ON-Roon-NetShare-R8-v1.8-S26-v1.9-RAW-SOOD-RECOVERY
          path: out/

  windows-relay:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.15.0
      - name: Apply PC origin-preserved query patch
        run: python tools/patch-pc-origin-query.py
      - name: Static origin-preserved checks
        shell: bash
        run: |
          grep -q 'SOOD_QUERY_PC=18' pc-relay/roon_netshare_relay.py
          grep -q 'SOOD_RESPONSE_R8=19' pc-relay/roon_netshare_relay.py
          grep -q 'deliver_r8_response_to_pc' pc-relay/roon_netshare_relay.py
          grep -q 'CONTROL_MAGIC=b"S26Q"' pc-relay/roon_netshare_relay.py
          grep -q 'handle_s26_query_control' pc-relay/roon_netshare_relay.py
          grep -q 'PC ROON ORIGINAL QUERY -> R8' pc-relay/roon_netshare_relay.py
          grep -q 'socket.MSG_PEEK' pc-relay/roon_netshare_relay.py
          grep -q 'ROON READY FOUND' pc-relay/roon_netshare_relay.py
          grep -q 'OPEN_OK' pc-relay/roon_netshare_relay.py
          grep -q 'ORIGIN-PRESERVED ROON READY' pc-relay/roon_netshare_relay.py
      - name: Syntax check
        run: python -m py_compile pc-relay/roon_netshare_relay.py
      - name: Build PC Relay
        run: pyinstaller --clean --onefile --name ON-Roon-NetShare-PC-Relay-v1.6-ORIGIN-PRESERVED pc-relay/roon_netshare_relay.py
      - name: Package Relay artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/ON-Roon-NetShare-PC-Relay-v1.6-ORIGIN-PRESERVED.exe out/
          (Get-FileHash out/ON-Roon-NetShare-PC-Relay-v1.6-ORIGIN-PRESERVED.exe -Algorithm SHA256).Hash | Out-File out/ON-Roon-NetShare-PC-Relay-v1.6-ORIGIN-PRESERVED.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ON-Roon-NetShare-PC-Relay-v1.6-ORIGIN-PRESERVED
          path: out/
