name: Build ON Roon NetShare Sidecar

on:
  push:
    branches: [ main, netshare-sidecar-v1 ]
    paths:
      - 'android-sidecar/**'
      - 'android-s26-gateway/**'
      - 'pc-relay/**'
      - '.github/workflows/build-sidecar.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android-sidecar/**'
      - 'android-s26-gateway/**'
      - 'pc-relay/**'
      - '.github/workflows/build-sidecar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable signing keys
        run: |
          base64 -d android-sidecar/onroonlink-test.jks.b64 > android-sidecar/onroonlink-test.jks
          cp android-sidecar/onroonlink-test.jks android-s26-gateway/onroonlink-test.jks
      - name: Static real-Roon checks
        run: |
          if grep -R 'bindSocket(' android-s26-gateway/app/src/main/java; then echo 'S26 must not use Network.bindSocket'; exit 1; fi
          grep -q 'SOOD_PACKET_PC=20' android-sidecar/app/src/main/java/com/onroonlink/sidecar/TunnelMux.java
          grep -q 'SOOD_PACKET_R8=21' android-sidecar/app/src/main/java/com/onroonlink/sidecar/TunnelMux.java
          grep -q 'Roon SOOD 양방향 브리지' android-sidecar/app/src/main/java/com/onroonlink/sidecar/BridgeService.java
          grep -q 'ensureR8Forwarder' android-sidecar/app/src/main/java/com/onroonlink/sidecar/BridgeService.java
          grep -q 'OPEN_PC' android-sidecar/app/src/main/java/com/onroonlink/sidecar/BridgeService.java
          grep -q 'stopService' android-sidecar/app/src/main/java/com/onroonlink/sidecar/MainActivity.java && { echo 'Destructive restart still present'; exit 1; } || true
          grep -q 'v1.6 REAL ROON' android-sidecar/app/src/main/java/com/onroonlink/sidecar/MainActivity.java
      - name: Build R8 APK
        working-directory: android-sidecar
        run: gradle --no-daemon :app:assembleDebug
      - name: Build S26 Gateway APK
        working-directory: android-s26-gateway
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signatures
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android-sidecar/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android-s26-gateway/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK alignment
        run: |
          $ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 android-sidecar/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 android-s26-gateway/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify no VpnService or VPN permission
        run: |
          $ANDROID_HOME/build-tools/36.0.0/aapt dump xmltree android-sidecar/app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml > r8-manifest.txt
          $ANDROID_HOME/build-tools/36.0.0/aapt dump xmltree android-s26-gateway/app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml > s26-manifest.txt
          if grep -qE 'android.net.VpnService|BIND_VPN_SERVICE' r8-manifest.txt s26-manifest.txt; then
            echo 'Unexpected VPN component found'; cat r8-manifest.txt; cat s26-manifest.txt; exit 1
          fi
      - name: Package Android artifacts
        run: |
          mkdir -p out
          cp android-sidecar/app/build/outputs/apk/debug/app-debug.apk out/ON-Roon-NetShare-R8-Sidecar-v1.6-REAL-ROON.apk
          cp android-s26-gateway/app/build/outputs/apk/debug/app-debug.apk out/ON-Roon-S26-Gateway-v1.6-FINAL.apk
          sha256sum out/ON-Roon-NetShare-R8-Sidecar-v1.6-REAL-ROON.apk > out/ON-Roon-NetShare-R8-Sidecar-v1.6-REAL-ROON.sha256.txt
          sha256sum out/ON-Roon-S26-Gateway-v1.6-FINAL.apk > out/ON-Roon-S26-Gateway-v1.6-FINAL.sha256.txt
          cp r8-manifest.txt s26-manifest.txt out/
      - uses: actions/upload-artifact@v4
        with:
          name: ON-Roon-NetShare-R8-v1.6-REAL-ROON-S26-v1.6
          path: out/

  windows-relay:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.15.0
      - name: Static real-Roon checks
        shell: bash
        run: |
          grep -q 'SOOD_PACKET_PC=20' pc-relay/roon_netshare_relay.py
          grep -q 'SOOD_PACKET_R8=21' pc-relay/roon_netshare_relay.py
          grep -q 'active_core_probe_loop' pc-relay/roon_netshare_relay.py
          grep -q 'ROON CORE FOUND REAL' pc-relay/roon_netshare_relay.py
          grep -q 'R8 OUTPUT REAL' pc-relay/roon_netshare_relay.py
      - name: Syntax check
        run: python -m py_compile pc-relay/roon_netshare_relay.py
      - name: Build PC Relay
        run: pyinstaller --clean --onefile --name ON-Roon-NetShare-PC-Relay-v1.4-REAL-ROON pc-relay/roon_netshare_relay.py
      - name: Package Relay artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/ON-Roon-NetShare-PC-Relay-v1.4-REAL-ROON.exe out/
          (Get-FileHash out/ON-Roon-NetShare-PC-Relay-v1.4-REAL-ROON.exe -Algorithm SHA256).Hash | Out-File out/ON-Roon-NetShare-PC-Relay-v1.4-REAL-ROON.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ON-Roon-NetShare-PC-Relay-v1.4-REAL-ROON
          path: out/
