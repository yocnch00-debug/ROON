name: Build ON ShareLink v1.5 + R8 Sidecar v2.6 FINAL

on:
  push:
    branches: [ on-sharelink-v15-roon-coexist-20260822 ]
    paths:
      - 'sharelink/**'
      - '.github/workflows/build-on-sharelink-v15-final.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sharelink/**'
      - '.github/workflows/build-on-sharelink-v15-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coexist-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare ShareLink signing and pinned HEV
        run: |
          set -euxo pipefail
          base64 -d sharelink/onroonlink-test.jks.b64 > sharelink/onroonlink-test.jks
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel.git /tmp/hev
          cd /tmp/hev
          git checkout 0428c4ebb0df933ebac8e507832f252ef7da47f1
          git submodule update --init --recursive
          "$ANDROID_HOME/ndk/27.2.12479018/ndk-build" -j2 \
            NDK_PROJECT_PATH="$PWD" APP_BUILD_SCRIPT="$PWD/Android.mk" \
            NDK_APPLICATION_MK="$PWD/Application.mk" APP_ABI=arm64-v8a APP_PLATFORM=android-29
          mkdir -p "$GITHUB_WORKSPACE/sharelink/client/src/main/jniLibs/arm64-v8a"
          cp libs/arm64-v8a/libhev-socks5-tunnel.so "$GITHUB_WORKSPACE/sharelink/client/src/main/jniLibs/arm64-v8a/"

      - name: Reconstruct exact frozen R8 v2.4 source used by device-proven v2.5
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin r8-v25-netshare-coexist-20260821
          FROZEN="$(git rev-parse FETCH_HEAD)"
          echo "Frozen source ref: $FROZEN"
          : > /tmp/r8-v24-source.b64
          for p in 01 02 03 04 05; do
            git show "${FROZEN}:tools/r8v24-source.b64.part${p}" >> /tmp/r8-v24-source.b64
          done
          base64 -d /tmp/r8-v24-source.b64 > /tmp/r8-v24-source.zip
          echo '0acf5fc2b68abe77be3e1eadb5e8d56260c3baee7b2503aa2233091f94795293  /tmp/r8-v24-source.zip' | sha256sum -c -
          unzip -t /tmp/r8-v24-source.zip >/dev/null
          rm -rf work-r8 && mkdir work-r8
          unzip -q /tmp/r8-v24-source.zip -d work-r8
          git show "${FROZEN}:android-sidecar/onroonlink-test.jks.b64" | base64 -d > work-r8/r8-v24/onroonlink-test.jks
          git show "${FROZEN}:tools/patch-r8-v25-netshare-coexist.py" > /tmp/patch-r8-v25-netshare-coexist.py
          test -f work-r8/r8-v24/app/src/main/java/com/onroonlink/sidecar/BridgeService.java

      - name: Reapply exact compile-safe session ownership fix from v2.5 build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work-r8/r8-v24/app/src/main/java/com/onroonlink/sidecar/BridgeService.java')
          s=p.read_text(encoding='utf-8')
          old='''        s.setTcpNoDelay(true);s.setKeepAlive(true);s.setSoTimeout(0);
                  status("PROXY","OK","S26 Gateway 연결 → "+GATEWAY_HOST+":"+GATEWAY_PORT);

                  TunnelMux tm=new TunnelMux(s);
                  long epoch;
                  synchronized(tunnelLock){
                      epoch=tunnelEpoch.incrementAndGet();
                      tunnelSocket=s;
                      mux=tm;
                  }
                  diag("SESSION_CONNECTED",session,epoch,"afterMs="+(SystemClock.elapsedRealtime()-started)+" local="+s.getLocalSocketAddress()+" remote="+s.getRemoteSocketAddress()+" route="+routeLabel(route));
                  AtomicLong lastInboundAt=new AtomicLong(SystemClock.uptimeMillis());
                  AtomicBoolean pongSeen=new AtomicBoolean(false);
                  AtomicBoolean routeValidationPending=new AtomicBoolean(false);
                  tm.sendText(TunnelMux.HELLO,0,"R8II|ON-SIDECAR|2.4-DIAGNOSTIC-STABLE");
                  ConnectivityManager.NetworkCallback watcher=watchWifiRoute(session,epoch,tm,s,route,routeValidationPending);
                  try{
                      workers.execute(()->heartbeatLoop(session,epoch,tm,s,route,routeValidationPending));
                      workers.execute(()->silentRecoveryLoop(session,epoch,tm,s,lastInboundAt,pongSeen));
          '''
          new='''        s.setTcpNoDelay(true);s.setKeepAlive(true);s.setSoTimeout(0);
                  final Socket sessionSocket=s;
                  status("PROXY","OK","S26 Gateway 연결 → "+GATEWAY_HOST+":"+GATEWAY_PORT);

                  TunnelMux tm=new TunnelMux(sessionSocket);
                  long epoch;
                  synchronized(tunnelLock){
                      epoch=tunnelEpoch.incrementAndGet();
                      tunnelSocket=sessionSocket;
                      mux=tm;
                  }
                  diag("SESSION_CONNECTED",session,epoch,"afterMs="+(SystemClock.elapsedRealtime()-started)+" local="+sessionSocket.getLocalSocketAddress()+" remote="+sessionSocket.getRemoteSocketAddress()+" route="+routeLabel(route));
                  AtomicLong lastInboundAt=new AtomicLong(SystemClock.uptimeMillis());
                  AtomicBoolean pongSeen=new AtomicBoolean(false);
                  AtomicBoolean routeValidationPending=new AtomicBoolean(false);
                  tm.sendText(TunnelMux.HELLO,0,"R8II|ON-SIDECAR|2.4-DIAGNOSTIC-STABLE");
                  ConnectivityManager.NetworkCallback watcher=watchWifiRoute(session,epoch,tm,sessionSocket,route,routeValidationPending);
                  try{
                      workers.execute(()->heartbeatLoop(session,epoch,tm,sessionSocket,route,routeValidationPending));
                      workers.execute(()->silentRecoveryLoop(session,epoch,tm,sessionSocket,lastInboundAt,pongSeen));
          '''
          if old not in s:
              raise SystemExit('v2.4 session ownership anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Recreate exact device-proven R8 v2.5 source
        run: |
          set -euxo pipefail
          python3 /tmp/patch-r8-v25-netshare-coexist.py
          ROOT=work-r8/r8-v24
          grep -q 'versionCode = 15' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "2.5-netshare-coexist"' "$ROOT/app/build.gradle.kts"
          grep -q '2.5-NETSHARE-COEXIST' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"
          grep -q 'connectOnWifiNetwork(route,GATEWAY_HOST,GATEWAY_PORT,5000)' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"
          grep -q 'route.network.getSocketFactory().createSocket()' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"
          echo '6f2afc68dbd660317c44f6cfe082bb254f2ea5f5e08dd59f107d11ebfe4c1800  '"$ROOT"'/app/src/main/java/com/onroonlink/sidecar/TunnelMux.java' | sha256sum -c -
          echo '36e17341da1605d613c71a330435c64bb9f244f8abe435f2c35c6156ef73816e  '"$ROOT"'/app/src/main/java/com/onroonlink/sidecar/SoodCodec.java' | sha256sum -c -
          echo 'd738c7035f3f09e2350fdd4fcd413c4684a52acdde604b1be5793ad253edd8b7  '"$ROOT"'/app/src/main/java/com/onroonlink/sidecar/LocalSoodInjector.java' | sha256sum -c -
          echo 'a996c9941a4e8ea81fd7b4a3e9261fee4d806dfd931cb5bf734ca94e2284ff92  '"$ROOT"'/app/src/main/AndroidManifest.xml' | sha256sum -c -
          echo '255c3c9777837d205fe813dd7c5754d0ea2ded9421ab97f47bea4afb87042bbf  '"$ROOT"'/app/src/main/res/values/styles.xml' | sha256sum -c -

      - name: Apply R8 v2.6 ShareLink coexist routing fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root=Path('work-r8/r8-v24')
          p=root/'app/src/main/java/com/onroonlink/sidecar/BridgeService.java'
          s=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'{label} anchor not found')
              s=s.replace(old,new,1)

          once('private static final String DIAG_FILE="roonbridge-v2.5.log";',
               'private static final String DIAG_FILE="roonbridge-v2.6.log";',
               'diag filename')
          once('R8II|ON-SIDECAR|2.5-NETSHARE-COEXIST',
               'R8II|ON-SIDECAR|2.6-SHARELINK-COEXIST',
               'hello version')
          if 'network recovery · NetShare coexist · diagnostic stable' in s:
              s=s.replace('network recovery · NetShare coexist · diagnostic stable',
                          'network recovery · ShareLink coexist · diagnostic stable',1)

          sig='    private WifiRoute findWifiRoute(){'
          start=s.find(sig)
          if start<0:
              raise SystemExit('findWifiRoute signature not found')
          brace=s.find('{',start)
          depth=0
          end=None
          for i in range(brace,len(s)):
              c=s[i]
              if c=='{': depth+=1
              elif c=='}':
                  depth-=1
                  if depth==0:
                      end=i+1
                      break
          if end is None:
              raise SystemExit('findWifiRoute closing brace not found')

          method='''    private WifiRoute findWifiRoute(){
        ConnectivityManager cm=(ConnectivityManager)getSystemService(CONNECTIVITY_SERVICE);if(cm==null)return null;
        try{
            for(Network n:cm.getAllNetworks()){
                NetworkCapabilities nc=cm.getNetworkCapabilities(n);if(nc==null)continue;
                LinkProperties lp=cm.getLinkProperties(n);
                String ifname=lp==null?null:lp.getInterfaceName();
                boolean virtual=nc.hasTransport(NetworkCapabilities.TRANSPORT_VPN)||!nc.hasCapability(NetworkCapabilities.NET_CAPABILITY_NOT_VPN);
                if(virtual){
                    if(nc.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)||(ifname!=null&&isVirtualInterface(ifname)))
                        diag("ROUTE_SKIP_VIRTUAL",0,tunnelEpoch.get(),"network="+n+" iface="+ifname+" caps="+nc);
                    continue;
                }
                if(!nc.hasTransport(NetworkCapabilities.TRANSPORT_WIFI))continue;
                if(lp==null||ifname==null)continue;
                if(isVirtualInterface(ifname)||!ifname.toLowerCase(Locale.ROOT).startsWith("wlan")){
                    diag("ROUTE_SKIP_VIRTUAL",0,tunnelEpoch.get(),"network="+n+" iface="+ifname+" reason=not-physical-wlan");
                    continue;
                }
                NetworkInterface ni=NetworkInterface.getByName(ifname);if(ni==null)continue;
                for(LinkAddress la:lp.getLinkAddresses()){
                    InetAddress a=la.getAddress();if(!(a instanceof Inet4Address)||a.isLoopbackAddress())continue;
                    if(!isS26ClientAddress(a)){
                        diag("ROUTE_SKIP_NON_S26_WLAN",0,tunnelEpoch.get(),"network="+n+" iface="+ifname+" addr="+a.getHostAddress());
                        continue;
                    }
                    WifiRoute r=new WifiRoute(n,ni,(Inet4Address)a,broadcast((Inet4Address)a,la.getPrefixLength()));
                    diag("ROUTE_PHYSICAL_SELECTED",0,tunnelEpoch.get(),"network="+n+" iface="+ifname+" addr="+a.getHostAddress());
                    return r;
                }
            }
        }catch(Throwable t){log("Wi-Fi 탐색: "+shortErr(t));diag("ROUTE_SCAN_ERROR",0,tunnelEpoch.get(),shortErr(t));}
        return null;
    }'''
          s=s[:start]+method+s[end:]

          anchor='    private ArrayList<InterfaceRoute> listInterfaceRoutes(){'
          if anchor not in s:
              raise SystemExit('route helper insertion anchor not found')
          helpers='''    private static boolean isVirtualInterface(String name){
        if(name==null)return true;
        String n=name.toLowerCase(Locale.ROOT);
        return n.startsWith("tun")||n.startsWith("tap")||n.startsWith("ppp")||n.startsWith("wg")||n.startsWith("ipsec")||n.startsWith("vti");
    }

    private static boolean isS26ClientAddress(InetAddress addr){
        if(!(addr instanceof Inet4Address))return false;
        byte[] b=addr.getAddress();
        int a=b[0]&255,c=b[1]&255,d=b[2]&255,h=b[3]&255;
        return a==192&&c==168&&d==49&&h>1&&h<255;
    }

'''
          s=s.replace(anchor,helpers+anchor,1)
          p.write_text(s,encoding='utf-8')

          p=root/'app/build.gradle.kts'
          g=p.read_text(encoding='utf-8')
          if 'versionCode = 15' not in g or 'versionName = "2.5-netshare-coexist"' not in g:
              raise SystemExit('v2.5 version anchors not found')
          g=g.replace('versionCode = 15','versionCode = 16',1).replace('versionName = "2.5-netshare-coexist"','versionName = "2.6-sharelink-coexist"',1)
          p.write_text(g,encoding='utf-8')

          p=root/'app/src/main/java/com/onroonlink/sidecar/MainActivity.java'
          m=p.read_text(encoding='utf-8')
          for old,new in [
              ('v2.5 NETSHARE COEXIST','v2.6 SHARELINK COEXIST'),
              ('roonbridge-v2.5.log.1','roonbridge-v2.6.log.1'),
              ('roonbridge-v2.5.log','roonbridge-v2.6.log')]:
              if old not in m:
                  raise SystemExit(f'MainActivity anchor not found: {old}')
              m=m.replace(old,new,1)
          p.write_text(m,encoding='utf-8')
          print('R8 v2.6 ShareLink physical-WLAN coexist patch applied')
          PY

      - name: Guard RoonLink protected paths and v2.6 routing behavior
        run: |
          set -euxo pipefail
          ROOT=work-r8/r8-v24
          B="$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"
          echo '6f2afc68dbd660317c44f6cfe082bb254f2ea5f5e08dd59f107d11ebfe4c1800  '"$ROOT"'/app/src/main/java/com/onroonlink/sidecar/TunnelMux.java' | sha256sum -c -
          echo '36e17341da1605d613c71a330435c64bb9f244f8abe435f2c35c6156ef73816e  '"$ROOT"'/app/src/main/java/com/onroonlink/sidecar/SoodCodec.java' | sha256sum -c -
          echo 'd738c7035f3f09e2350fdd4fcd413c4684a52acdde604b1be5793ad253edd8b7  '"$ROOT"'/app/src/main/java/com/onroonlink/sidecar/LocalSoodInjector.java' | sha256sum -c -
          echo 'a996c9941a4e8ea81fd7b4a3e9261fee4d806dfd931cb5bf734ca94e2284ff92  '"$ROOT"'/app/src/main/AndroidManifest.xml' | sha256sum -c -
          echo '255c3c9777837d205fe813dd7c5754d0ea2ded9421ab97f47bea4afb87042bbf  '"$ROOT"'/app/src/main/res/values/styles.xml' | sha256sum -c -

          grep -q 'versionCode = 16' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "2.6-sharelink-coexist"' "$ROOT/app/build.gradle.kts"
          grep -q '2.6-SHARELINK-COEXIST' "$B"
          grep -q 'TRANSPORT_VPN' "$B"
          grep -q 'NET_CAPABILITY_NOT_VPN' "$B"
          grep -q 'ROUTE_SKIP_VIRTUAL' "$B"
          grep -q 'ROUTE_PHYSICAL_SELECTED' "$B"
          grep -q 'isVirtualInterface' "$B"
          grep -q 'isS26ClientAddress' "$B"
          grep -q 'startsWith("wlan")' "$B"
          grep -q 'a==192&&c==168&&d==49' "$B"
          grep -q 'connectOnWifiNetwork(route,GATEWAY_HOST,GATEWAY_PORT,5000)' "$B"
          grep -q 'route.network.getSocketFactory().createSocket()' "$B"
          grep -q 'physical Wi-Fi bind mismatch' "$B"
          grep -q 'SOOD_CACHE_UPDATE' "$B"
          grep -q 'SOOD_CACHE_FALLBACK' "$B"
          grep -q 'SOOD_CACHE_INVALIDATED' "$B"
          grep -q 'ROUTE_CONFIRM_MS=1800L' "$B"
          grep -q 'ROUTE_TRANSIENT_IGNORED' "$B"
          grep -q 'WLAN-SELF' "$B"
          grep -q 'AUX_UDP_TO_R8=40' "$ROOT/app/src/main/java/com/onroonlink/sidecar/TunnelMux.java"
          grep -q 'AUX_UDP_FROM_R8=41' "$ROOT/app/src/main/java/com/onroonlink/sidecar/TunnelMux.java"
          grep -q 'roonbridge-v2.6.log' "$ROOT/app/src/main/java/com/onroonlink/sidecar/MainActivity.java"
          if grep -q 'connectWithoutNetworkBind' "$B"; then echo 'ERROR: unbound gateway path returned'; exit 1; fi
          if grep -q 'android.net.VpnService' "$ROOT/app/src/main/AndroidManifest.xml"; then echo 'ERROR: Roon Sidecar became a VPN'; exit 1; fi

      - name: Guard ShareLink Internet path and Sidecar bypass
        run: |
          set -euxo pipefail
          H=sharelink/host/src/main/java/com/onsharelink/host/Socks5Server.java
          V=sharelink/client/src/main/java/com/onsharelink/client/ShareVpnService.java
          P=sharelink/client/src/main/java/com/onsharelink/client/PublicRoutes.java
          grep -q "versionName '1.4-no-bind'" sharelink/host/build.gradle
          grep -q "versionName '1.5-roon-coexist'" sharelink/client/build.gradle
          grep -q 'OUTBOUND_DEFAULT_ROUTE_TCP_OK' "$H"
          grep -q 'OUTBOUND_DEFAULT_ROUTE_UDP_OK' "$H"
          if grep -q 'getSocketFactory().createSocket' "$H"; then echo 'ERROR: Host forced cellular socket bind regressed'; exit 1; fi
          if grep -q 'bindSocket' "$H"; then echo 'ERROR: Host UDP forced bind regressed'; exit 1; fi
          grep -q '\.allowBypass()' "$V"
          grep -q 'VPN_ALLOW_BYPASS physical-network binding enabled' "$V"
          grep -q 'addDisallowedApplication("com.onroonlink.sidecar")' "$V"
          grep -q 'SOCKS_AUTH_OK' sharelink/client/src/main/java/com/onsharelink/client/ClientLinkService.java
          grep -q 'HEALTH_TRANSIENT_FAIL' sharelink/client/src/main/java/com/onsharelink/client/ClientLinkService.java
          if grep -q '0.0.0.0/0' "$P"; then echo 'ERROR: default VPN route swallows local Roon'; exit 1; fi
          if grep -q '192.168.49' "$P"; then echo 'ERROR: S26 local subnet entered VPN'; exit 1; fi
          if grep -R -i -n 'kha\.prog\.mikrotik\|Proxy-agent: NetShare' sharelink --exclude='r8v26-sharelink-source.zip'; then echo 'ERROR: proprietary NetShare reference found'; exit 1; fi

      - name: Build S26 ShareLink Host and R8 ShareLink Client
        working-directory: sharelink
        run: gradle --no-daemon :host:assembleRelease :client:assembleRelease

      - name: Build R8 Roon Sidecar v2.6
        working-directory: work-r8/r8-v24
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify all APKs
        run: |
          set -euxo pipefail
          H=sharelink/host/build/outputs/apk/release/host-release.apk
          C=sharelink/client/build/outputs/apk/release/client-release.apk
          R=work-r8/r8-v24/app/build/outputs/apk/release/app-release.apk
          test -f "$H"; test -f "$C"; test -f "$R"
          for A in "$H" "$C" "$R"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$A"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$A" >/dev/null
            unzip -t "$A" >/dev/null
          done

      - name: Package matched coexist set
        run: |
          set -euxo pipefail
          mkdir -p out
          cp sharelink/host/build/outputs/apk/release/host-release.apk out/ON-ShareLink-S26-Host-v1.4-NO-BIND.apk
          cp sharelink/client/build/outputs/apk/release/client-release.apk out/ON-ShareLink-R8-Client-v1.5-ROON-COEXIST.apk
          cp work-r8/r8-v24/app/build/outputs/apk/release/app-release.apk out/ON-Roon-R8-Sidecar-v2.6-SHARELINK-COEXIST.apk
          cp sharelink/THIRD_PARTY_NOTICES.md out/THIRD_PARTY_NOTICES.md
          (cd work-r8 && zip -qr /tmp/R8-v2.6-source.zip r8-v24 -x 'r8-v24/onroonlink-test.jks' 'r8-v24/app/build/*' 'r8-v24/.gradle/*')
          cp /tmp/R8-v2.6-source.zip out/R8-v2.6-source.zip
          sha256sum out/*.apk out/R8-v2.6-source.zip > out/SHA256SUMS.txt
          cat > out/README.txt <<'TXT'
          ON ShareLink + ON RoonLink simultaneous coexist set

          Install/update:
          - S26: ON-ShareLink-S26-Host-v1.4-NO-BIND.apk
          - R8 II: ON-ShareLink-R8-Client-v1.5-ROON-COEXIST.apk
          - R8 II: ON-Roon-R8-Sidecar-v2.6-SHARELINK-COEXIST.apk

          Root cause fixed:
          Android can expose the ShareLink VPN Network with inherited Wi-Fi characteristics. The old Sidecar could therefore select tun0 / 198.18.0.2 as its Wi-Fi route even while the real physical ShareLink Wi-Fi was wlan0 / 192.168.49.x.

          v2.6 Sidecar now rejects TRANSPORT_VPN, networks without NET_CAPABILITY_NOT_VPN, virtual interfaces (tun/tap/ppp/wg/ipsec/vti), non-wlan interfaces, and wlan IPv4 addresses outside 192.168.49.x. Only the real S26 direct Wi-Fi path can be used for 192.168.49.1:51921.

          ShareLink Client v1.5 keeps public Internet in its VPN, excludes the Roon Sidecar from that VPN, and enables VpnService.allowBypass() so the Sidecar can explicitly bind its socket to the real physical Android Network.

          Frozen RoonLink protected paths retained byte-for-byte from device-proven v2.5:
          - TunnelMux framing
          - dynamic RAAT AUX TCP/UDP
          - SOOD codec/injector
          - Android manifest
          - styles/audio-independent app shell

          S26 ShareLink Host v1.4 remains the current working NO-BIND Internet relay. PC RoonLink, S26 RoonLink, HiBy Roon Ready and USB/Tamra audio paths are not modified.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: ON-ShareLink-v1.5-Roon-Coexist-R8-v2.6-FINAL
          path: out/
