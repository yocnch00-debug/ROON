name: Build ON ShareLink v1.5 + R8 Sidecar v2.6 COEXIST

on:
  push:
    branches: [ on-sharelink-v15-roon-coexist-20260822 ]
    paths:
      - 'sharelink/**'
      - '.github/workflows/build-on-sharelink-v15-roon-coexist.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sharelink/**'
      - '.github/workflows/build-on-sharelink-v15-roon-coexist.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare stable signing key
        run: |
          set -euxo pipefail
          base64 -d sharelink/onroonlink-test.jks.b64 > sharelink/onroonlink-test.jks

      - name: Build pinned MIT tun2socks for R8 arm64
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel.git /tmp/hev
          cd /tmp/hev
          git checkout 0428c4ebb0df933ebac8e507832f252ef7da47f1
          git submodule update --init --recursive
          "$ANDROID_HOME/ndk/27.2.12479018/ndk-build" -j2 \
            NDK_PROJECT_PATH="$PWD" \
            APP_BUILD_SCRIPT="$PWD/Android.mk" \
            NDK_APPLICATION_MK="$PWD/Application.mk" \
            APP_ABI=arm64-v8a APP_PLATFORM=android-29
          mkdir -p "$GITHUB_WORKSPACE/sharelink/client/src/main/jniLibs/arm64-v8a"
          cp libs/arm64-v8a/libhev-socks5-tunnel.so "$GITHUB_WORKSPACE/sharelink/client/src/main/jniLibs/arm64-v8a/"

      - name: Reconstruct exact R8 Sidecar v2.6 source
        run: |
          set -euxo pipefail
          echo '179e21960bc1076769f40cd16aa355053d06c6e5cbcbf2a16e4ec6e6e97efe46  sharelink/r8v26-sharelink-source.zip' | sha256sum -c -
          unzip -t sharelink/r8v26-sharelink-source.zip
          mkdir -p work-r8
          unzip -q sharelink/r8v26-sharelink-source.zip -d work-r8
          test -f work-r8/r8v26_sharelink/app/src/main/java/com/onroonlink/sidecar/BridgeService.java
          cp sharelink/onroonlink-test.jks work-r8/r8v26_sharelink/onroonlink-test.jks

      - name: RoonLink protected-path regression guards
        run: |
          set -euxo pipefail
          ROOT=work-r8/r8v26_sharelink

          # These are byte-identical to the device-validated v2.5 protected paths.
          echo '6f2afc68dbd660317c44f6cfe082bb254f2ea5f5e08dd59f107d11ebfe4c1800  '"$ROOT"'/app/src/main/java/com/onroonlink/sidecar/TunnelMux.java' | sha256sum -c -
          echo '36e17341da1605d613c71a330435c64bb9f244f8abe435f2c35c6156ef73816e  '"$ROOT"'/app/src/main/java/com/onroonlink/sidecar/SoodCodec.java' | sha256sum -c -
          echo 'd738c7035f3f09e2350fdd4fcd413c4684a52acdde604b1be5793ad253edd8b7  '"$ROOT"'/app/src/main/java/com/onroonlink/sidecar/LocalSoodInjector.java' | sha256sum -c -
          echo 'a996c9941a4e8ea81fd7b4a3e9261fee4d806dfd931cb5bf734ca94e2284ff92  '"$ROOT"'/app/src/main/AndroidManifest.xml' | sha256sum -c -
          echo '255c3c9777837d205fe813dd7c5754d0ea2ded9421ab97f47bea4afb87042bbf  '"$ROOT"'/app/src/main/res/values/styles.xml' | sha256sum -c -

          grep -q 'versionCode = 16' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "2.6-sharelink-coexist"' "$ROOT/app/build.gradle.kts"
          grep -q '2.6-SHARELINK-COEXIST' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"

          # Root-cause fix: never mistake a VPN Network inheriting WIFI transport for physical wlan0.
          grep -q 'TRANSPORT_VPN' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"
          grep -q 'NET_CAPABILITY_NOT_VPN' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"
          grep -q 'ROUTE_SKIP_VIRTUAL' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"
          grep -q 'ROUTE_PHYSICAL_SELECTED' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"
          grep -q 'isS26ClientAddress' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"
          grep -q 'if(!ifn.toLowerCase(Locale.US).startsWith("wlan"))continue' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"
          grep -q 'connectOnWifiNetwork(route,GATEWAY_HOST,GATEWAY_PORT,5000)' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"
          grep -q 'route.network.getSocketFactory().createSocket()' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"

          # Existing successful RAAT/SOOD/lifecycle paths must remain present.
          grep -q 'SOOD_CACHE_UPDATE' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"
          grep -q 'SOOD_CACHE_FALLBACK' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"
          grep -q 'SOOD_CACHE_INVALIDATED' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"
          grep -q 'ROUTE_CONFIRM_MS=1800L' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"
          grep -q 'ROUTE_TRANSIENT_IGNORED' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"
          grep -q 'AUX_UDP_TO_R8=40' "$ROOT/app/src/main/java/com/onroonlink/sidecar/TunnelMux.java"
          grep -q 'AUX_UDP_FROM_R8=41' "$ROOT/app/src/main/java/com/onroonlink/sidecar/TunnelMux.java"
          grep -q 'WLAN-SELF' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"
          grep -q 'roonbridge-v2.6.log' "$ROOT/app/src/main/java/com/onroonlink/sidecar/MainActivity.java"
          if grep -q 'connectWithoutNetworkBind' "$ROOT/app/src/main/java/com/onroonlink/sidecar/BridgeService.java"; then echo 'Unbound Roon gateway path regressed'; exit 1; fi
          if grep -q 'android.net.VpnService' "$ROOT/app/src/main/AndroidManifest.xml"; then echo 'Unexpected Roon Sidecar VpnService regression'; exit 1; fi

      - name: ShareLink v1.5 coexist regression guards
        run: |
          set -euxo pipefail
          ! grep -R -i -n 'kha\.prog\.mikrotik\|Proxy-agent: NetShare' sharelink --exclude='r8v26-sharelink-source.zip'

          # S26 v1.4 Internet relay stays on the already-working no-bind implementation.
          grep -q 'OUTBOUND_DEFAULT_ROUTE_TCP_OK' sharelink/host/src/main/java/com/onsharelink/host/Socks5Server.java
          grep -q 'OUTBOUND_DEFAULT_ROUTE_UDP_OK' sharelink/host/src/main/java/com/onsharelink/host/Socks5Server.java
          ! grep -q 'getSocketFactory().createSocket' sharelink/host/src/main/java/com/onsharelink/host/Socks5Server.java
          ! grep -q 'bindSocket' sharelink/host/src/main/java/com/onsharelink/host/Socks5Server.java
          grep -q "versionName '1.4-no-bind'" sharelink/host/build.gradle

          # R8 Internet VPN keeps split routes, but explicitly permits physical-network binding.
          grep -q '\.allowBypass()' sharelink/client/src/main/java/com/onsharelink/client/ShareVpnService.java
          grep -q 'VPN_ALLOW_BYPASS physical-network binding enabled' sharelink/client/src/main/java/com/onsharelink/client/ShareVpnService.java
          grep -q 'addDisallowedApplication("com.onroonlink.sidecar")' sharelink/client/src/main/java/com/onsharelink/client/ShareVpnService.java
          grep -q 'SOCKS_AUTH_OK' sharelink/client/src/main/java/com/onsharelink/client/ClientLinkService.java
          grep -q 'external preflight intentionally skipped' sharelink/client/src/main/java/com/onsharelink/client/ClientLinkService.java
          grep -q 'HEALTH_TRANSIENT_FAIL' sharelink/client/src/main/java/com/onsharelink/client/ClientLinkService.java
          grep -q "versionName '1.5-roon-coexist'" sharelink/client/build.gradle
          grep -q 'targetSdk 28' sharelink/client/build.gradle
          grep -q 'addNetwork(cfg)' sharelink/client/src/main/java/com/onsharelink/client/WifiBootstrap.java
          if grep -q '0.0.0.0/0' sharelink/client/src/main/java/com/onsharelink/client/PublicRoutes.java; then echo 'Default route would swallow local Roon paths'; exit 1; fi
          if grep -q '192.168.49.' sharelink/client/src/main/java/com/onsharelink/client/PublicRoutes.java; then echo 'S26/Roon local subnet accidentally entered VPN routes'; exit 1; fi

      - name: Build signed S26 Host and R8 ShareLink Client
        working-directory: sharelink
        run: gradle --no-daemon :host:assembleRelease :client:assembleRelease

      - name: Build signed R8 Roon Sidecar v2.6
        working-directory: work-r8/r8v26_sharelink
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify all APKs and package
        run: |
          set -euxo pipefail
          H=sharelink/host/build/outputs/apk/release/host-release.apk
          C=sharelink/client/build/outputs/apk/release/client-release.apk
          R=work-r8/r8v26_sharelink/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$R" ]; then R=work-r8/r8v26_sharelink/app/build/outputs/apk/release/app-release-unsigned.apk; fi
          test -f "$H"; test -f "$C"; test -f "$R"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$H" > /tmp/host-sign.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$C" > /tmp/client-sign.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$R" > /tmp/sidecar-sign.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$H" > /tmp/host-align.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$C" > /tmp/client-align.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$R" > /tmp/sidecar-align.txt
          unzip -t "$H" >/tmp/host-unzip.txt
          unzip -t "$C" >/tmp/client-unzip.txt
          unzip -t "$R" >/tmp/sidecar-unzip.txt

          mkdir -p out
          cp "$H" out/ON-ShareLink-S26-Host-v1.4-NO-BIND.apk
          cp "$C" out/ON-ShareLink-R8-Client-v1.5-ROON-COEXIST.apk
          cp "$R" out/ON-Roon-R8-Sidecar-v2.6-SHARELINK-COEXIST.apk
          cp sharelink/THIRD_PARTY_NOTICES.md out/THIRD_PARTY_NOTICES.md
          cp work-r8/r8v26_sharelink/SHARELINK-COEXIST-NOTES.txt out/R8-SIDECAR-COEXIST-NOTES.txt
          cp /tmp/host-sign.txt out/HOST-SIGNATURE.txt
          cp /tmp/client-sign.txt out/CLIENT-SIGNATURE.txt
          cp /tmp/sidecar-sign.txt out/SIDECAR-SIGNATURE.txt
          sha256sum out/*.apk > out/SHA256SUMS.txt

          cat > out/README.txt <<'TXT'
          ON ShareLink / ON RoonLink simultaneous coexist test bundle

          S26:
          - ON ShareLink Host v1.4 NO-BIND: unchanged Internet relay path that already works with S26 RoonLink VPN.

          R8 II:
          - ON ShareLink Client v1.5 ROON-COEXIST: public Internet stays in ShareLink VPN; allowBypass permits explicit physical-Network binding; Roon Sidecar remains excluded.
          - ON Roon Sidecar v2.6 SHARELINK-COEXIST: based on exact v2.5 source; VPN/tun networks are excluded from physical Wi-Fi selection, and only wlan + 192.168.49.x is eligible for S26 gateway 51921.

          Expected simultaneous path:
          Internet -> ShareLink VPN/tun2socks -> S26 Host -> S26 public/default LTE/5G route
          Roon -> R8 Sidecar -> physical wlan0 192.168.49.x -> S26 Gateway :51921 -> existing RoonLink -> PC

          Protected and unchanged:
          TunnelMux framing, dynamic RAAT AUX TCP/UDP, SOOD codec/injector, Sidecar manifest, PC RoonLink, S26 RoonLink, USB/Tamra audio path.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: ON-ShareLink-v1.5-Roon-Coexist-R8-v2.6
          path: out/
