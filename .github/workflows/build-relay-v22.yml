name: Build ON Roon PC Relay v2.4

on:
  push:
    branches: [ main, netshare-sidecar-v1 ]
    paths:
      - 'pc-relay/roon_netshare_relay.py'
      - 'pc-relay/roon_netshare_relay_v3.py'
      - '.github/workflows/build-relay-v22.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pc-relay/roon_netshare_relay.py'
      - 'pc-relay/roon_netshare_relay_v3.py'
      - '.github/workflows/build-relay-v22.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-relay:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stable RAAT proxy unit checks
        shell: bash
        run: |
          python -m py_compile pc-relay/roon_netshare_relay.py pc-relay/roon_netshare_relay_v3.py
          python - <<'PY'
          import sys,socket
          sys.path.insert(0,'pc-relay')
          import roon_netshare_relay as b
          import roon_netshare_relay_v3 as v

          tid,probe=v.make_probe()
          p=b.parse_sood(probe)
          assert p and p[0]=='Q'
          assert p[1]['service_id']==v.RAAT_SERVICE
          assert 'query_service_id' not in p[1]

          # One R8/device must keep one PC proxy even when HiBy rotates its real RAAT port.
          p1,c1=v.ensure_stable_forwarder('device-123','tcp_port','127.0.0.1',43811)
          p2,c2=v.ensure_stable_forwarder('device-123','tcp_port','127.0.0.1',46829)
          assert p1==p2
          assert c1 is True and c2 is True
          target=v.get_target(v.stable_key('device-123','tcp_port'))
          assert target[1]==46829 and target[3]==p1

          r=b.encode_sood('R',{
            '_tid':tid,
            '_replyaddr':'127.0.0.2',
            '_replyport':'9003',
            'service_id':v.RAAT_SERVICE,
            'unique_id':'device-xyz',
            'vendor':'HiBy',
            'model':'R8II',
            'tcp_port':'44857'})
          built=v.build_endpoint_announcement(r)
          assert built is not None
          q,props,changed=built
          out=b.parse_sood(q)
          assert out and out[0]=='Q'
          assert props['service_id']==v.RAAT_SERVICE
          assert props['unique_id']=='device-xyz'
          assert props['tcp_port']!='44857'
          assert '_replyaddr' not in props and '_replyport' not in props

          src=open('pc-relay/roon_netshare_relay_v3.py',encoding='utf-8').read()
          assert '2.4-FINAL-STABLE-RAAT-PROXY' in src
          assert 'RAAT TARGET ROTATED' in src
          assert 'RAAT BACKEND OPEN RETRY' in src
          assert 'stableProxyPorts' in src
          print('v2.4 stable RAAT proxy rotation/retry tests PASS')
          PY
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.15.0
      - name: Build PC Relay v2.4
        run: pyinstaller --clean --onefile --paths pc-relay --name ON-Roon-NetShare-PC-Relay-v2.4-STABLE-RAAT pc-relay/roon_netshare_relay_v3.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/ON-Roon-NetShare-PC-Relay-v2.4-STABLE-RAAT.exe out/
          (Get-FileHash out/ON-Roon-NetShare-PC-Relay-v2.4-STABLE-RAAT.exe -Algorithm SHA256).Hash | Out-File out/SHA256.txt
          @(
            'PC-only update. Keep R8 Sidecar v1.9 and S26 Transport v2.0 unchanged.',
            'PC proxy port is stable per Roon Ready endpoint even when HiBy rotates its real dynamic RAAT tcp_port.',
            'Backend target is atomically updated from each successful native RAAT probe.',
            'On stale-target OPEN_ERR, the PC Roon socket is kept open while an immediate probe refreshes the backend and retries.',
            'Repeated unchanged native announcements are rate-limited.'
          ) | Set-Content out/INSTALL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ON-Roon-PC-Relay-v2.4-STABLE-RAAT
          path: out/
