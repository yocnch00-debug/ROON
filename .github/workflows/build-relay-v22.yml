name: Build ON Roon PC Relay v2.2

on:
  push:
    branches: [ main, netshare-sidecar-v1 ]
    paths:
      - 'pc-relay/roon_netshare_relay.py'
      - 'pc-relay/roon_netshare_relay_v3.py'
      - '.github/workflows/build-relay-v22.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pc-relay/roon_netshare_relay.py'
      - 'pc-relay/roon_netshare_relay_v3.py'
      - '.github/workflows/build-relay-v22.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-relay:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Direct announce unit checks
        shell: bash
        run: |
          python -m py_compile pc-relay/roon_netshare_relay.py pc-relay/roon_netshare_relay_v3.py
          python - <<'PY'
          import sys,socket
          sys.path.insert(0,'pc-relay')
          import roon_netshare_relay as b
          import roon_netshare_relay_v3 as v
          r=b.encode_sood('R',{
            '_tid':'test-tid',
            'service_id':v.RAAT_SERVICE,
            'unique_id':'device-123',
            'vendor':'HiBy',
            'model':'R8 II',
            'output_name':'R8 II',
            'protocol_version':'3',
            'tcp_port':'44857'})
          built=v.build_endpoint_announcement(r,lambda prop,p:7477)
          assert built is not None
          q,props=built
          p=b.parse_sood(q)
          assert p and p[0]=='Q'
          assert props['service_id']==v.RAAT_SERVICE
          assert props['tcp_port']=='7477'
          # Windows must support the virtual loopback alias used as the announced endpoint source.
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
          try:
              s.bind((v.VIRTUAL_SOURCE_IP,0))
          finally:
              s.close()
          # No PC :9003 listener is allowed in this mode; otherwise it can steal our own announcement.
          src=open('pc-relay/roon_netshare_relay_v3.py',encoding='utf-8').read()
          assert 'pc_sood_listener' not in src
          assert 'ROON READY ANNOUNCED TO PC ROON' in src
          assert 'R8 ROON READY PROBE' in src
          print('v2.2 direct Roon Ready announce tests PASS')
          PY
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.15.0
      - name: Build PC Relay v2.2
        run: pyinstaller --clean --onefile --paths pc-relay --name ON-Roon-NetShare-PC-Relay-v2.2-DIRECT-ANNOUNCE pc-relay/roon_netshare_relay_v3.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/ON-Roon-NetShare-PC-Relay-v2.2-DIRECT-ANNOUNCE.exe out/
          (Get-FileHash out/ON-Roon-NetShare-PC-Relay-v2.2-DIRECT-ANNOUNCE.exe -Algorithm SHA256).Hash | Out-File out/SHA256.txt
          @(
            'PC-only update. Keep R8 Sidecar v1.9 and S26 Transport v2.0 unchanged.',
            'Relay does not bind UDP 9003.',
            'It actively probes R8, converts the real HiBy RAAT response into a SOOD Q endpoint announcement, and injects it to PC Roon.',
            'Dynamic RAAT TCP ports are still tunneled by the existing forwarder.'
          ) | Set-Content out/INSTALL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ON-Roon-PC-Relay-v2.2-DIRECT-ANNOUNCE
          path: out/
