name: Build ON Roon PC Relay v2.3

on:
  push:
    branches: [ main, netshare-sidecar-v1 ]
    paths:
      - 'pc-relay/roon_netshare_relay.py'
      - 'pc-relay/roon_netshare_relay_v3.py'
      - '.github/workflows/build-relay-v22.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pc-relay/roon_netshare_relay.py'
      - 'pc-relay/roon_netshare_relay_v3.py'
      - '.github/workflows/build-relay-v22.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-relay:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native RAAT service-id unit checks
        shell: bash
        run: |
          python -m py_compile pc-relay/roon_netshare_relay.py pc-relay/roon_netshare_relay_v3.py
          python - <<'PY'
          import sys,socket
          sys.path.insert(0,'pc-relay')
          import roon_netshare_relay as b
          import roon_netshare_relay_v3 as v

          tid,probe=v.make_probe()
          p=b.parse_sood(probe)
          assert p and p[0]=='Q'
          assert p[1]['_tid']==tid
          assert p[1]['service_id']==v.RAAT_SERVICE
          assert 'query_service_id' not in p[1]

          r=b.encode_sood('R',{
            '_tid':tid,
            '_replyaddr':'127.0.0.2',
            '_replyport':'9003',
            'query_service_id':'wrong-transaction-field',
            'service_id':v.RAAT_SERVICE,
            'unique_id':'device-123',
            'vendor':'HiBy',
            'model':'R8 II',
            'output_name':'R8 II',
            'protocol_version':'3',
            'tcp_port':'44857'})
          built=v.build_endpoint_announcement(r,lambda prop,p:7477)
          assert built is not None
          q,props=built
          out=b.parse_sood(q)
          assert out and out[0]=='Q'
          assert props['service_id']==v.RAAT_SERVICE
          assert props['tcp_port']=='7477'
          assert props['_tid']!=tid
          assert '_replyaddr' not in props
          assert '_replyport' not in props
          assert 'query_service_id' not in props
          assert props['unique_id']=='device-123'

          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
          try:
              s.bind((v.VIRTUAL_SOURCE_IP,0))
          finally:
              s.close()

          src=open('pc-relay/roon_netshare_relay_v3.py',encoding='utf-8').read()
          assert 'pc_sood_listener' not in src
          assert '2.3-FINAL-RAAT-SERVICE-ID' in src
          assert 'R8 RAAT PROBE' in src
          assert 'ROON READY NATIVE ANNOUNCE' in src
          print('v2.3 native RAAT service_id probe + announcement tests PASS')
          PY
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.15.0
      - name: Build PC Relay v2.3
        run: pyinstaller --clean --onefile --paths pc-relay --name ON-Roon-NetShare-PC-Relay-v2.3-NATIVE-RAAT pc-relay/roon_netshare_relay_v3.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/ON-Roon-NetShare-PC-Relay-v2.3-NATIVE-RAAT.exe out/
          (Get-FileHash out/ON-Roon-NetShare-PC-Relay-v2.3-NATIVE-RAAT.exe -Algorithm SHA256).Hash | Out-File out/SHA256.txt
          @(
            'PC-only update. Keep R8 Sidecar v1.9 and S26 Transport v2.0 unchanged.',
            'Probe uses service_id=5e2042ad-9bc5-4508-be92-ff68f19bdc93 exactly as the RAAT SDK requires.',
            'Real HiBy response is converted to a fresh native RAAT QUERY announcement with dynamic tcp_port rewritten to the existing PC forwarder.',
            'No PC UDP 9003 listener is opened by the relay.'
          ) | Set-Content out/INSTALL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ON-Roon-PC-Relay-v2.3-NATIVE-RAAT
          path: out/
