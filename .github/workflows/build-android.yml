name: Build Android APK

on:
  push:
    branches: [ v05-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct v0.5 source
        run: |
          cat .buildsrc/v05.part* > on-roonlink-v0.5.b64
          base64 -d on-roonlink-v0.5.b64 > on-roonlink-v0.5-source.zip
          unzip -q on-roonlink-v0.5-source.zip -d v05
          test -f v05/android-app/app/src/main/java/com/onroonlink/app/MainActivity.java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: v05/android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Collect APK
        run: cp v05/android-app/app/build/outputs/apk/debug/app-debug.apk ON-RoonLink-v0.5-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ON-RoonLink-v0.5-debug-apk
          path: ON-RoonLink-v0.5-debug.apk
