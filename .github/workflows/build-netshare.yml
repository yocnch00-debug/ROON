name: Build ON RoonLink NetShare APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-netshare/**'
      - '.github/workflows/build-netshare.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build NetShare APK
        working-directory: android-netshare
        run: gradle --no-daemon :app:assembleDebug
      - name: Collect APK
        run: cp android-netshare/app/build/outputs/apk/debug/app-debug.apk ON-RoonLink-Native-v1-alpha3-NETSHARE.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ON-RoonLink-Native-v1-alpha3-NETSHARE
          path: ON-RoonLink-Native-v1-alpha3-NETSHARE.apk
