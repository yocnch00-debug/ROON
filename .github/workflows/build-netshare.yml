name: Build ON RoonLink NetShare APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-netshare/**'
      - '.github/workflows/build-netshare.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build NetShare APK
        working-directory: android-netshare
        run: gradle --no-daemon :app:assembleDebug
      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp android-netshare/app/build/outputs/apk/debug/app-debug.apk artifacts/ON-RoonLink-Native-v1-alpha3-NETSHARE.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ON-RoonLink-Native-v1-alpha3-NETSHARE
          path: artifacts/ON-RoonLink-Native-v1-alpha3-NETSHARE.apk
      - name: Publish APK into repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/ON-RoonLink-Native-v1-alpha3-NETSHARE.apk
          git commit -m 'Build NetShare APK [skip ci]' || exit 0
          git push
