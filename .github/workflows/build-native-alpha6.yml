name: Build Native Alpha6 APK

on:
  push:
    branches: [ "native-alpha6-build" ]
    paths:
      - "native-alpha6/**"
      - ".github/workflows/build-native-alpha6.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "native-alpha6/**"
      - ".github/workflows/build-native-alpha6.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: native-alpha6/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp native-alpha6/android/app/build/outputs/apk/debug/app-debug.apk ON-RoonLink-Native-v1-alpha6-UDP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ON-RoonLink-Native-v1-alpha6-UDP
          path: ON-RoonLink-Native-v1-alpha6-UDP.apk
          if-no-files-found: error
