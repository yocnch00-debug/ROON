plugins { id 'com.android.application' }

android {
    namespace 'com.onsharelink.host'
    compileSdk 35
    defaultConfig {
        applicationId 'com.onsharelink.host'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2-direct-wifi'
    }
    signingConfigs {
        onTest {
            storeFile file('../onroonlink-test.jks')
            storePassword 'onroonlink'
            keyAlias 'onroonlink'
            keyPassword 'onroonlink'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.onTest }
        release { minifyEnabled false; signingConfig signingConfigs.onTest }
    }
}
